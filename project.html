  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin/supabase.js"></script>
  <script>
    /* ---- NAV scroll + burger ---- */
    const nav     = document.getElementById('main-nav');
    const burger  = document.getElementById('nav-burger');
    const overlay = document.getElementById('nav-overlay');
    window.addEventListener('scroll', () => { nav.classList.toggle('scrolled', window.scrollY > 40); }, { passive: true });
    nav.classList.toggle('scrolled', window.scrollY > 40);
    burger.addEventListener('click', () => {
      const isOpen = document.body.classList.toggle('menu-open');
      burger.setAttribute('aria-expanded', isOpen);
      overlay.setAttribute('aria-hidden', !isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });
    overlay.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      document.body.classList.remove('menu-open');
      burger.setAttribute('aria-expanded', 'false');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.body.classList.contains('menu-open')) {
        document.body.classList.remove('menu-open');
        burger.setAttribute('aria-expanded', 'false');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }
    });

    /* ---- HELPERS ---- */
    function hl(text) { if (!text) return ''; return text.replace(/\*(.*?)\*/g, '<em>$1</em>'); }

    function animateMarkSVG(wrapper) {
      const svg = wrapper.querySelector('svg');
      if (!svg) return;
      const paths = Array.from(svg.querySelectorAll('path'));
      const textEls = Array.from(svg.querySelectorAll('text'));
      if (!paths.length) return;

      // Resolve fill: check inline attribute first, then SVG's <style> block for class-based fills
      function resolveF(el) {
        const a = el.getAttribute('fill');
        if (a && a !== 'none') return a;
        const cls = (el.getAttribute('class') || '').split(/\s+/)[0];
        if (cls) {
          const st = svg.querySelector('style');
          if (st) {
            const m = st.textContent.match(new RegExp('\\.' + cls + '\\s*\\{([^}]+)\\}'));
            if (m) { const fm = m[1].match(/fill\s*:\s*([^;}\n]+)/); if (fm) return fm[1].trim(); }
          }
        }
        return '#568065';
      }

      const lengths = paths.map(p => { try { return p.getTotalLength(); } catch(e) { return 0; } });
      const maxLen = Math.max(...lengths);
      const mainIdx = lengths.indexOf(maxLen);

      paths.forEach((p, i) => {
        const fill = resolveF(p);
        p._origFill = fill;
        p._isGrad = fill.startsWith('url(');
        p.style.fill = 'none';
        p.style.stroke = fill;             // SVG supports url() gradient references as stroke
        p.style.strokeWidth = i === mainIdx ? '2.5' : '1.5';
        p.style.strokeLinecap = 'round';
        p.style.strokeLinejoin = 'round';
        p.style.strokeDasharray = lengths[i];
        p.style.strokeDashoffset = lengths[i];
        p.style.transition = 'none';
      });
      textEls.forEach(t => { t.style.opacity = '0'; });

      const DRAW_MAIN = 2000, DRAW_DEC = 600, STAGGER = 60;

      function animatePath(p, drawDuration, startMs) {
        setTimeout(() => {
          p.style.transition = `stroke-dashoffset ${drawDuration}ms cubic-bezier(0.4,0,0.2,1)`;
          p.style.strokeDashoffset = '0';
        }, startMs);
        setTimeout(() => {
          p.style.fill = p._origFill;
          if (p._isGrad) {
            // Gradient paints can't CSS-transition; fade stroke-width to 0 for a clean finish
            p.style.transition = 'stroke-width 350ms ease';
            p.style.strokeWidth = '0';
          } else {
            p.style.transition = 'fill 400ms ease, stroke 400ms ease';
            p.style.stroke = 'transparent';
          }
        }, startMs + drawDuration - 60);
      }

      animatePath(paths[mainIdx], DRAW_MAIN, 150);
      const decPaths = paths.filter((_, i) => i !== mainIdx);
      decPaths.forEach((p, i) => animatePath(p, DRAW_DEC, 500 + i * STAGGER));

      const textStart = Math.max(DRAW_MAIN + 400, 500 + decPaths.length * STAGGER + DRAW_DEC + 200);
      textEls.forEach(t => {
        setTimeout(() => {
          t.style.transition = 'opacity 0.8s ease';
          t.style.opacity = '1';
        }, textStart);
      });
    }
    function vimeoEmbed(url) {
      if (!url) return null;
      const m = url.match(/vimeo\.com\/(\d+)/);
      return m ? `https://player.vimeo.com/video/${m[1]}?autoplay=0&loop=1&title=0&byline=0&portrait=0&dnt=1` : null;
    }
    function imgTile(url, cls, cap) {
      return url
        ? `<div class="${cls}"><img src="${url}" alt="${cap}" loading="lazy"><span class="apps-tile__cap">${cap}</span></div>`
        : `<div class="${cls}" style="border:1px dashed oklch(0 0 0/0.12);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0 0 0/0.18);">${cap}</div>`;
    }
    function digTile(url, cls, cap) {
      return url ? `<div class="${cls}"><img src="${url}" alt="${cap}" loading="lazy"><span class="dig-tile__cap">${cap}</span></div>` : '';
    }

    /* ---- LOAD PROJECT ---- */
    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) {
        document.getElementById('app').innerHTML = `<div class="loading-screen">No project ID. <a href="work.html" style="color:var(--accent);">← Back to Work</a></div>`;
        return;
      }

      const [{ data: p, error }, { data: moreProjects }] = await Promise.all([
        db.from('case_studies').select('*').eq('id', id).eq('status', 'published').single(),
        db.from('case_studies')
          .select('id, client, title, industry, img_hero, sort_order')
          .eq('status', 'published').neq('id', id)
          .order('sort_order', { ascending: true, nullsFirst: false }).limit(3)
      ]);

      if (error || !p) {
        document.getElementById('app').innerHTML = `<div class="loading-screen">Project not found or not published. <a href="work.html" style="color:var(--accent);">← Back to Work</a></div>`;
        return;
      }

      document.title = `${p.client || p.title} — ${p.title || 'Project'} | Parallax`;

      if (p.accent_color) {
        document.documentElement.style.setProperty('--accent', p.accent_color);
        document.documentElement.style.setProperty('--accent-muted', p.accent_color + '25');
        document.documentElement.style.setProperty('--accent-soft',  p.accent_color + '10');
      }

      const services     = Array.isArray(p.services) ? p.services.join(' · ') : (p.services || '—');
      const colours      = Array.isArray(p.brand_colours) ? p.brand_colours : [];
      const tokens       = p.brand_tokens || {};
      const atoms        = Array.isArray(p.brand_atoms) ? p.brand_atoms : [];
      const uiComponents = Array.isArray(p.brand_ui) ? p.brand_ui : [];
      const widgets      = Array.isArray(p.brand_widgets) ? p.brand_widgets : [];
      const fontSources  = Array.isArray(p.brand_fonts?.sources) ? p.brand_fonts.sources : [];
      const fonts        = fontSources.filter(s => s.family);
      const stats        = [1,2,3,4,5].map(i => ({ value: p[`stat${i}_value`], label: p[`stat${i}_label`] })).filter(s => s.value);
      const outcomes     = [1,2,3,4].map(i => ({ title: p[`outcome${i}_title`], desc: p[`outcome${i}_description`] })).filter(o => o.title);
      const allSwatches  = colours.flatMap(g => (g.swatches || []).map(s => ({ ...s, group: g.name || '' })));

      // Load Google fonts
      const googleSources = fontSources.filter(s => s.source === 'google' && s.family);
      if (googleSources.length) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?${googleSources.map(s => `family=${encodeURIComponent(s.family)}:wght@100..900`).join('&')}&display=swap`;
        document.head.appendChild(link);
      }
      const uploadedSources = fontSources.filter(s => s.source === 'upload' && s.url && s.family);
      if (uploadedSources.length) {
        const st = document.createElement('style');
        st.textContent = uploadedSources.map(s => {
          const ext = s.url.split('?')[0].split('.').pop().toLowerCase();
          const fmt = ext === 'woff2' ? 'woff2' : ext === 'woff' ? 'woff' : ext === 'ttf' ? 'truetype' : 'opentype';
          return `@font-face { font-family: '${s.family}'; src: url('${s.url}') format('${fmt}'); font-display: swap; }`;
        }).join('\n');
        document.head.appendChild(st);
      }

      /* -- Render helpers (need p/allSwatches/etc in scope) -- */
      function renderPaletteCard() {
        if (!allSwatches.length) return '';
        const first = allSwatches[0];
        const btns = allSwatches.map((s, i) =>
          `<button class="bsys-swatch${i===0?' active':''}" style="background:${s.hex};" data-hex="${s.hex}" data-name="${s.name||''}" data-usage="${s.group||''}" aria-label="${s.name||s.hex}"></button>`).join('');
        return `<div class="bsys-card" id="bsys-palette-card">
          <div class="bsys-card__head"><span class="bsys-card__label">Colour Palette</span><span class="bsys-card__meta">${allSwatches.length} tokens</span></div>
          <div class="bsys-palette" id="bsys-palette">${btns}</div>
          <div class="bsys-readout" id="bsys-readout">
            <span class="bsys-readout__chip" style="background:${first.hex};"></span>
            <span class="bsys-readout__name">${first.name||''}${first.group?' — '+first.group:''}</span>
            <span class="bsys-readout__hex">${first.hex}</span>
          </div></div>`;
      }
      function renderTypographyCard() {
        if (!fonts.length) return '';
        const family = fonts[0].family || 'sans-serif';
        const wbtns = [{w:400,l:'Regular'},{w:700,l:'Bold'}]
          .map(({w,l}) => `<button class="bsys-wbtn${w===700?' active':''}" data-weight="${w}">${l}</button>`).join('');
        return `<div class="bsys-card" id="bsys-typo-card">
          <div class="bsys-card__head"><span class="bsys-card__label">Typography</span><span class="bsys-card__meta">${family}</span></div>
          <div class="bsys-type-weights" id="bsys-weights">${wbtns}</div>
          <p class="bsys-type-preview" id="bsys-preview" style="font-family:'${family}',sans-serif;font-weight:700;">${family}</p>
          <div class="bsys-type-scale">
            ${[['Heading',64],['Subheading',32],['Body',16],['Caption',12]].map(([n,v]) =>
              `<div class="bsys-type-scale__item"><span class="bsys-type-scale__val">${v}</span><span class="bsys-type-scale__name">${n}</span></div>`).join('')}
          </div></div>`;
      }
      function renderMarquee() {
        if (!allSwatches.length) return '';
        const items = allSwatches.map(s =>
          `<span class="bsys-marquee__item"><span style="width:10px;height:10px;flex-shrink:0;background:${s.hex};display:inline-block;"></span><span>${s.hex}</span><span style="color:var(--accent)">${s.name||''}</span></span>
           <span class="bsys-marquee__item"><span style="color:var(--accent);font-weight:800;">&#10022;</span></span>`).join('');
        return `<div class="bsys-marquee" aria-hidden="true"><div class="bsys-marquee__track">${items}${items}</div></div>`;
      }
      function renderTokens() {
        if (!tokens.spacing && !tokens.radius && !tokens.grid && !tokens.elevation) return '';
        const rpx = parseInt(tokens.radius)||14;
        const defs = [
          { key:'spacing',   name:'Spacing',   val:tokens.spacing||'4 · 8 · 16 · 32 · 64', demo:`<div class="bsys-token__demo">${[4,8,16,32,64].map(w=>`<span style="width:${w}px;"></span>`).join('')}</div>` },
          { key:'radius',    name:'Radius',    val:`${rpx}px`,                               demo:`<div class="bsys-token__demo"><div class="bsys-token__radius" style="border-radius:${rpx}px;"></div></div>` },
          { key:'elevation', name:'Elevation', val:tokens.elevation||'—',                    demo:`<div class="bsys-token__demo"><div class="bsys-token__shadow"></div></div>` },
          { key:'grid',      name:'Grid',      val:tokens.grid||'—',                         demo:`<div class="bsys-token__demo" style="gap:2px;">${Array(6).fill('<span style="width:10%;height:60%;"></span>').join('')}</div>` },
        ].filter(d => tokens[d.key] || d.key === 'spacing');
        return `<div class="bsys-tokens">${defs.map(d=>`<div class="bsys-token"><p class="bsys-token__name">${d.name}</p>${d.demo}<p class="bsys-token__val">${d.val}</p></div>`).join('')}</div>`;
      }
      const ATOM_DEFS = {
        action:   { label:'Action',   demo:`<button class="bsys-demo-btn">Confirm &#8594;</button><button class="bsys-demo-btn bsys-demo-btn--g">Cancel</button>` },
        field:    { label:'Field',    demo:`<input class="bsys-demo-input" type="text" placeholder="Enter value">` },

    /* ---- BRAND SYSTEM interactivity (called after render) ---- */
    function initBrandSystem() {
      const palette = document.getElementById('bsys-palette');
      const readout = document.getElementById('bsys-readout');
      if (palette && readout) {
        const chip = readout.querySelector('.bsys-readout__chip');
        const name = readout.querySelector('.bsys-readout__name');
        const hex  = readout.querySelector('.bsys-readout__hex');
        palette.addEventListener('click', e => {
          const btn = e.target.closest('.bsys-swatch');
          if (!btn) return;
          palette.querySelectorAll('.bsys-swatch').forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          chip.style.background = btn.dataset.hex;
          name.textContent = btn.dataset.name + (btn.dataset.usage ? ' — ' + btn.dataset.usage : '');
          hex.textContent  = btn.dataset.hex;
        });
      }
      const group   = document.getElementById('bsys-weights');
      const preview = document.getElementById('bsys-preview');
      if (group && preview) {
        group.addEventListener('click', e => {
          const btn = e.target.closest('.bsys-wbtn');
          if (!btn) return;
          group.querySelectorAll('.bsys-wbtn').forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          preview.style.fontWeight = btn.dataset.weight;
        });
      }
    }

    /* ---- ALL INTERACTIVITY (wired after innerHTML is set) ---- */
    function initInteractivity() {
      /* Scroll reveal */
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.reveal, .stagger, .bsys-token').forEach(el => io.observe(el));

      /* Stat count-up */
      (function () {
        function easeOut(t) { return 1 - Math.pow(1-t, 3); }
        function animate(el) {
          const target = parseInt(el.dataset.count, 10);
          if (isNaN(target)) return;
          const start = performance.now();
          (function step(now) {
            const p = Math.min((now - start) / 1600, 1);
            el.textContent = Math.round(easeOut(p) * target);
            if (p < 1) requestAnimationFrame(step); else el.textContent = target;
          })(performance.now());
        }
        const grid = document.querySelector('.proj-stats__grid');
        if (!grid) return;
        new IntersectionObserver(([e]) => {
          if (!e.isIntersecting) return;
          document.querySelectorAll('.stat-val[data-count]').forEach((el, i) => setTimeout(() => animate(el), i * 100));
        }, { threshold: 0.3 }).observe(grid);
      })();

      /* CTA cursor fx */
      (function () {
        const band = document.getElementById('cta-band');
        if (!band || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
        band.addEventListener('mousemove', e => {
          const r = band.getBoundingClientRect();
          band.style.setProperty('--ctx', ((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
          band.style.setProperty('--cty', ((e.clientY-r.top)/r.height*100).toFixed(1)+'%');
        });
        band.addEventListener('mouseleave', () => { band.style.setProperty('--ctx','50%'); band.style.setProperty('--cty','50%'); });
      })();

      /* World clocks */
      (function () {
        const zones = [{id:'clock-de',tz:'Europe/Berlin'},{id:'clock-ae',tz:'Asia/Dubai'},{id:'clock-in',tz:'Asia/Kolkata'}];
        function fmt(tz) { return new Date().toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); }
        function tick() {
          zones.forEach(({id,tz}) => {
            const el = document.getElementById(id); if (!el) return;
            const t = fmt(tz);
            if (el.textContent !== t) { el.textContent = t; el.classList.add('tick'); setTimeout(()=>el.classList.remove('tick'),120); }
          });
        }
        tick(); setInterval(tick, 1000);
      })();

      /* Brand system */
      initBrandSystem();

      /* Parallax */
      (function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const targets = Array.from(document.querySelectorAll('[data-parallax]'));
        if (!targets.length) return;
        let ticking = false;
        function update() {
          const vh = window.innerHeight;
          targets.forEach(el => {
            const r = el.getBoundingClientRect();
            if (r.bottom < -100 || r.top > vh+100) return;
            const dist = (r.top + r.height/2 - vh/2) / vh;
            el.style.transform = `translateY(${(-dist * (parseFloat(el.dataset.parallax)||0.15) * 80).toFixed(2)}px)`;
          });
          ticking = false;
        }
        window.addEventListener('scroll', () => { if (!ticking) { requestAnimationFrame(update); ticking = true; } }, { passive: true });
        window.addEventListener('resize', update);
        update();
      })();

      /* Magnetic hover */
      (function () {
        if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.querySelectorAll('.magnet').forEach(el => {
          el.addEventListener('mousemove', e => {
            const r = el.getBoundingClientRect();
            el.style.transform = `translate(${(((e.clientX-r.left)/r.width-0.5)*14).toFixed(1)}px,${(((e.clientY-r.top)/r.height-0.5)*14).toFixed(1)}px)`;
          });
          el.addEventListener('mouseleave', () => { el.style.transform = ''; });
        });
      })();
    }
  </script>
</body>
</html>

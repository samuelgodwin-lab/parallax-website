<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logomark — Animation Preview</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    transition: background 0.4s ease;
  }

  .showcase {
    position: relative;
    overflow: hidden;
    background: #0d0d0d;
    border: 1px solid #1c1c1c;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 72px 64px;
    width: 640px;
    min-height: 320px;
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .showcase::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .showcase.light { background: #f5f5f3; border-color: #e0ddd8; }
  .showcase.light::before {
    background-image: radial-gradient(circle, rgba(0,0,0,0.07) 1px, transparent 1px);
  }

  .showcase svg {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 360px;
    height: auto;
    display: block;
  }

  .controls {
    position: fixed;
    bottom: 28px;
    right: 28px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .ctrl {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.65);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 9px 18px;
    border-radius: 5px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    font-family: -apple-system, sans-serif;
  }
  .ctrl:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .ctrl.accent { background: #f45b25; color: #fff; border-color: #f45b25; }
</style>
</head>
<body>

  </svg>
</div>

<div class="controls">
  <button class="ctrl" id="theme-btn">Light</button>
  <button class="ctrl accent" id="replay-btn">Replay</button>
</div>

<script>
  const SPRING  = 'cubic-bezier(0.34, 1.4, 0.64, 1)';
  const EASE_OUT = 'ease-out';

  function setStart(el, tx, ty) {
    el.style.transition = 'none';
    el.style.opacity    = '0';
    el.style.transform  = `translate(${tx}px, ${ty}px)`;
  }

  function arrive(el, delay, dur) {
    setTimeout(() => {
      el.style.transition = `opacity ${dur}ms ${EASE_OUT}, transform ${dur * 1.1}ms ${SPRING}`;
      el.style.opacity    = '1';
      el.style.transform  = 'translate(0, 0)';
    }, delay);
  }

  function reset() {
    const body       = document.getElementById('logo-body');
    const bottomArcs = Array.from(document.querySelectorAll('#logo-arcs-bottom path'));
    const topArcs    = Array.from(document.querySelectorAll('#logo-arcs-top path'));
    [body, ...bottomArcs, ...topArcs].forEach(el => {
      el.style.transition = 'none';
      el.style.opacity    = '1';
      el.style.transform  = 'translate(0, 0)';
    });
  }

  function animate() {
    const body       = document.getElementById('logo-body');
    const bottomArcs = Array.from(document.querySelectorAll('#logo-arcs-bottom path'));
    const topArcs    = Array.from(document.querySelectorAll('#logo-arcs-top path'));

    // Set starting positions — all hidden and offset
    setStart(body, 0, 28);
    bottomArcs.forEach(p => setStart(p, -22, 0));
    topArcs.forEach(p    => setStart(p,  22, 0));

    requestAnimationFrame(() => requestAnimationFrame(() => {
      // Body rises from below
      arrive(body, 60, 860);

      // Bottom arcs sweep in from the left, L→R stagger
      bottomArcs.forEach((p, i) => arrive(p, 110 + i * 62, 680));

      // Top arcs sweep in from the right, R→L stagger (offset 80ms behind bottom)
      topArcs.forEach((p, i)    => arrive(p, 190 + i * 62, 680));
    }));
  }

  // Light / dark toggle
  let isLight = false;
  document.getElementById('theme-btn').addEventListener('click', () => {
    isLight = !isLight;
    const showcase = document.getElementById('showcase');
    document.body.style.background = isLight ? '#eeede9' : '#0d0d0d';
    showcase.classList.toggle('light', isLight);
    document.getElementById('theme-btn').textContent = isLight ? 'Dark' : 'Light';
  });

  document.getElementById('replay-btn').addEventListener('click', () => {
    reset();
    setTimeout(animate, 80);
  });

  window.addEventListener('load', animate);
</script>
</body>
</html>

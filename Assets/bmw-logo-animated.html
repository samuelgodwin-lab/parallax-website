<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW — Logo Animation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0c0c0c;
    transition: background 0.4s ease;
  }

  .showcase {
    position: relative;
    overflow: hidden;
    background: #0c0c0c;
    border: 1px solid #1e1e1e;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 100px;
    width: 560px;
    min-height: 400px;
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .showcase.light { background: #f4f4f2; border-color: #dedbd5; }

  .showcase::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .showcase.light::before {
    background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
  }

  #bmw-logo {
    position: relative;
    z-index: 1;
    width: 220px;
    height: auto;
    display: block;
    overflow: visible;
  }

  /* Allow transform-box so transform-origin: 50% 50% is relative to each path's own bbox */
  #bmw-logo path {
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  .controls {
    position: fixed;
    bottom: 28px;
    right: 28px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .ctrl {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.65);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 9px 20px;
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: -apple-system, sans-serif;
    transition: background 0.2s, color 0.2s;
  }
  .ctrl:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .ctrl.primary { background: #1a3d7c; color: #fff; border-color: #1a3d7c; }
</style>
</head>

<div class="controls">
  <button class="ctrl" id="theme-btn">Light</button>
  <button class="ctrl primary" id="replay-btn">Replay</button>
</div>

<script>
  const SPRING = 'cubic-bezier(0.34, 1.32, 0.64, 1)';
  const EASE   = 'ease-out';

  // Path groups by element ID
  const G = {
    outerRing:    ['p0'],
    outerBg:      ['p1','p2'],
    medCircle:    ['p3'],
    innerPlate:   ['p10','p11'],
    blueNW:       ['p12'],
    blueSE:       ['p13'],
    cross:        ['p14'],
    overlays:     ['p15','p16','p17','p18','p19','p20','p21','p22'],
    letterShadow: ['p4','p5','p6'],
    letterGrad:   ['p7','p8','p9'],
  };

  function grp(key) {
    return G[key].map(id => document.getElementById(id)).filter(Boolean);
  }

  function freeze(el, styles) {
    el.style.transition = 'none';
    Object.assign(el.style, styles);
  }

  function tween(el, delay, dur, styles, ease) {
    setTimeout(() => {
      const props = Object.keys(styles)
        .map(k => `${k.replace(/([A-Z])/g, c => '-' + c.toLowerCase())} ${dur}ms ${ease || EASE}`)
        .join(', ');
      el.style.transition = props;
      Object.assign(el.style, styles);
    }, delay);
  }

  function allPaths() {
    return Array.from(document.getElementById('bmw-logo').querySelectorAll('path'));
  }

  function reset() {
    allPaths().forEach(p => {
      p.style.transition = 'none';
      p.style.opacity    = '1';
      p.style.transform  = 'none';
    });
  }

  function animate() {
    // Hide all
    allPaths().forEach(p => freeze(p, { opacity: '0', transform: 'none' }));

    requestAnimationFrame(() => requestAnimationFrame(() => {

      // ── 1. Chrome ring — scales in from slightly large ──
      grp('outerRing').forEach(p => {
        freeze(p, { opacity: '0', transform: 'scale(1.07)' });
        tween(p, 120, 950, { opacity: '1', transform: 'scale(1)' }, SPRING);
      });

      // ── 2. Black background circles — fade ──
      grp('outerBg').forEach(p => {
        freeze(p, { opacity: '0' });
        tween(p, 320, 550, { opacity: '1' });
      });

      // ── 3. Medium grey circle — scale from centre ──
      grp('medCircle').forEach(p => {
        freeze(p, { opacity: '0', transform: 'scale(0.88)' });
        tween(p, 550, 650, { opacity: '1', transform: 'scale(1)' }, SPRING);
      });

      // ── 4. Inner plate — scale in, slightly tighter ──
      grp('innerPlate').forEach(p => {
        freeze(p, { opacity: '0', transform: 'scale(0.8)' });
        tween(p, 680, 680, { opacity: '1', transform: 'scale(1)' }, SPRING);
      });

      // ── 5. Blue quadrants — slide in from opposing corners ──
      grp('blueNW').forEach(p => {
        freeze(p, { opacity: '0', transform: 'translate(-22px,-22px)' });
        tween(p, 940, 580, { opacity: '1', transform: 'translate(0,0)' }, SPRING);
      });
      grp('blueSE').forEach(p => {
        freeze(p, { opacity: '0', transform: 'translate(22px,22px)' });
        tween(p, 990, 580, { opacity: '1', transform: 'translate(0,0)' }, SPRING);
      });

      // ── 6. Cross dividers — pop in from center ──
      grp('cross').forEach(p => {
        freeze(p, { opacity: '0', transform: 'scale(0.65)' });
        tween(p, 1200, 480, { opacity: '1', transform: 'scale(1)' }, SPRING);
      });

      // ── 7. Gradient overlays — staggered fade ──
      grp('overlays').forEach((p, i) => {
        freeze(p, { opacity: '0' });
        tween(p, 1280 + i * 40, 700, { opacity: '1' });
      });

      // ── 8. Letter shadows — slide down from above ──
      grp('letterShadow').forEach((p, i) => {
        freeze(p, { opacity: '0', transform: 'translateY(-18px)' });
        tween(p, 1440 + i * 60, 520, { opacity: '1', transform: 'translateY(0)' }, SPRING);
      });

      // ── 9. Letter gradients — same, tiny offset behind shadows ──
      grp('letterGrad').forEach((p, i) => {
        freeze(p, { opacity: '0', transform: 'translateY(-18px)' });
        tween(p, 1460 + i * 60, 520, { opacity: '1', transform: 'translateY(0)' }, SPRING);
      });

    }));
  }

  // Theme toggle
  let light = false;
  document.getElementById('theme-btn').addEventListener('click', () => {
    light = !light;
    const sc = document.getElementById('showcase');
    document.body.style.background = light ? '#eeede9' : '#0c0c0c';
    sc.classList.toggle('light', light);
    document.getElementById('theme-btn').textContent = light ? 'Dark' : 'Light';
  });

  // Replay
  document.getElementById('replay-btn').addEventListener('click', () => {
    reset();
    setTimeout(animate, 80);
  });

  window.addEventListener('load', animate);
</script>
</body>
</html>

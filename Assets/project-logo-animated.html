<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Animation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f8f8;
    font-family: -apple-system, sans-serif;
    transition: background 0.4s ease;
  }

  .mark-showcase {
    position: relative;
    overflow: hidden;
    background: #f8f8f8;
    border: 1px solid #e8e8e8;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 72px 64px;
    min-height: 280px;
    width: 560px;
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .mark-showcase.dark {
    background: #0d0d0d;
    border-color: #1e1e1e;
  }

  .mark-showcase::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .mark-showcase.dark::before {
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  }

  .mark-showcase svg {
    position: relative;
    z-index: 1;
    max-width: 320px;
    width: 100%;
    height: auto;
  }

  .controls {
    position: fixed;
    bottom: 28px;
    right: 28px;
    display: flex;
    gap: 8px;
  }

  .ctrl {
    background: rgba(0,0,0,0.06);
    color: rgba(0,0,0,0.55);
    border: 1px solid rgba(0,0,0,0.1);
    padding: 9px 18px;
    border-radius: 5px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: -apple-system, sans-serif;
    transition: background 0.2s, color 0.2s;
  }
  .ctrl:hover { background: rgba(0,0,0,0.1); color: #000; }
  .ctrl.accent { background: #21255b; color: #fff; border-color: #21255b; }
</style>
</head>
<body>

<div class="mark-showcase" id="mark-showcase">

      </g>
    </g>
  </svg>
</div>

<div class="controls">
  <button class="ctrl" id="theme-btn">Dark</button>
  <button class="ctrl accent" id="replay-btn">Replay</button>
</div>

<script>
  function animateMarkSVG(wrapper) {
    const svg = wrapper.querySelector('svg');
    if (!svg) return;
    const paths  = Array.from(svg.querySelectorAll('path'));
    const textEls = Array.from(svg.querySelectorAll('text'));
    if (!paths.length) return;

    function resolveF(el) {
      const a = el.getAttribute('fill');
      if (a && a !== 'none') return a;
      const cls = (el.getAttribute('class') || '').split(/\s+/)[0];
      if (cls) {
        const st = svg.querySelector('style');
        if (st) {
          const m = st.textContent.match(new RegExp('\\.' + cls + '\\s*\\{([^}]+)\\}'));
          if (m) { const fm = m[1].match(/fill\s*:\s*([^;}\n]+)/); if (fm) return fm[1].trim(); }
        }
      }
      return '#21255b';
    }

    const lengths = paths.map(p => { try { return p.getTotalLength(); } catch(e) { return 0; } });
    const maxLen  = Math.max(...lengths);
    const mainIdx = lengths.indexOf(maxLen);

    paths.forEach((p, i) => {
      const fill = resolveF(p);
      p._origFill = fill;
      p._isGrad   = fill.startsWith('url(');
      p.style.fill            = 'none';
      p.style.stroke          = fill;
      p.style.strokeWidth     = i === mainIdx ? '2.5' : '1.5';
      p.style.strokeLinecap   = 'round';
      p.style.strokeLinejoin  = 'round';
      p.style.strokeDasharray = lengths[i];
      p.style.strokeDashoffset = lengths[i];
      p.style.transition      = 'none';
    });
    textEls.forEach(t => { t.style.opacity = '0'; });

    const DRAW_MAIN = 1800, DRAW_DEC = 550, STAGGER = 55;

    function animatePath(p, drawDuration, startMs) {
      setTimeout(() => {
        p.style.transition = `stroke-dashoffset ${drawDuration}ms cubic-bezier(0.4,0,0.2,1)`;
        p.style.strokeDashoffset = '0';
      }, startMs);
      setTimeout(() => {
        p.style.fill = p._origFill;
        if (p._isGrad) {
          p.style.transition  = 'stroke-width 350ms ease';
          p.style.strokeWidth = '0';
        } else {
          p.style.transition = 'fill 400ms ease, stroke 400ms ease';
          p.style.stroke     = 'transparent';
        }
      }, startMs + drawDuration - 60);
    }

    animatePath(paths[mainIdx], DRAW_MAIN, 100);
    const decPaths = paths.filter((_, i) => i !== mainIdx);
    decPaths.forEach((p, i) => animatePath(p, DRAW_DEC, 420 + i * STAGGER));

    const textStart = Math.max(DRAW_MAIN + 400, 420 + decPaths.length * STAGGER + DRAW_DEC + 200);
    textEls.forEach(t => {
      setTimeout(() => {
        t.style.transition = 'opacity 0.8s ease';
        t.style.opacity    = '1';
      }, textStart);
    });
  }

  function resetAndPlay() {
    const wrapper = document.getElementById('mark-showcase');
    wrapper.querySelectorAll('path').forEach(p => {
      p.style.transition       = 'none';
      p.style.fill             = '';
      p.style.stroke           = '';
      p.style.strokeDasharray  = '';
      p.style.strokeDashoffset = '';
    });
    setTimeout(() => animateMarkSVG(wrapper), 50);
  }

  // Theme toggle
  let dark = false;
  document.getElementById('theme-btn').addEventListener('click', () => {
    dark = !dark;
    const sc = document.getElementById('mark-showcase');
    document.body.style.background = dark ? '#0d0d0d' : '#f8f8f8';
    sc.classList.toggle('dark', dark);
    document.getElementById('theme-btn').textContent = dark ? 'Light' : 'Dark';
  });

  document.getElementById('replay-btn').addEventListener('click', resetAndPlay);

  window.addEventListener('load', () => {
    animateMarkSVG(document.getElementById('mark-showcase'));
  });
</script>
</body>
</html>

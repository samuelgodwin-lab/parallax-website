<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axel — Fleet Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f0f2f5; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px 20px 18px;
      width: 340px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    /* ── Header ── */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .card-title { font-size: 14px; font-weight: 600; color: #111; letter-spacing: -0.01em; }
    .card-controls { display: flex; align-items: center; gap: 8px; }
    .card-dropdown {
      font-size: 11px; font-weight: 500; color: #888;
      background: #f4f4f6; border-radius: 6px;
      padding: 3px 8px; cursor: pointer;
    }
    .card-expand { font-size: 13px; color: #bbb; cursor: pointer; line-height: 1; }

    /* ── Bar chart ── */
    .bars-row {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 10px; height: 130px; padding: 0 4px;
    }
    .bar-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 6px;
    }
    .bar-number {
      font-size: 22px; font-weight: 800; color: #111; letter-spacing: -0.04em;
      line-height: 1; transition: opacity 0.3s;
    }
    .bar-track {
      width: 100%; flex: 1; border-radius: 100px;
      background: #f0f2f5; overflow: hidden;
      display: flex; align-items: flex-end;
      position: relative;
    }
    .bar-fill {
      width: 100%;
      border-radius: 100px;
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 1.1s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    .bar-fill.animate { transform: scaleY(1); }

    /* Each bar gets a unique gradient + height */
    .bar-item:nth-child(1) .bar-fill {
      height: 82%;
      background: linear-gradient(to top, #5bb8e8, #6be6c4);
    }
    .bar-item:nth-child(2) .bar-fill {
      height: 46%;
      background: linear-gradient(to top, #5bb8e8, #6be6c4);
    }
    .bar-item:nth-child(3) .bar-fill {
      height: 46%;
      background: linear-gradient(to top, #5bb8e8, #6be6c4);
    }
    .bar-item:nth-child(4) .bar-fill {
      height: 22%;
      background: linear-gradient(to top, #5bb8e8, #6be6c4);
    }

    /* Stagger animation delay per bar */
    .bar-item:nth-child(1) .bar-fill { transition-delay: 0.05s; }
    .bar-item:nth-child(2) .bar-fill { transition-delay: 0.18s; }
    .bar-item:nth-child(3) .bar-fill { transition-delay: 0.31s; }
    .bar-item:nth-child(4) .bar-fill { transition-delay: 0.44s; }

    .bar-label {
      font-size: 10px; font-weight: 500; color: #999; text-align: center;
      letter-spacing: 0.01em; white-space: nowrap;
    }

    /* ── Footer ── */
    .card-footer {
      margin-top: 16px;
      font-size: 12px; font-weight: 600;
      color: #3dbf7a; letter-spacing: -0.01em;
      opacity: 0; transform: translateY(4px);
      transition: opacity 0.5s ease 1.2s, transform 0.5s ease 1.2s;
    }
    .card-footer.animate { opacity: 1; transform: translateY(0); }
    .card-footer::before { content: '↑ '; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <span class="card-title">Fleet Status</span>
      <div class="card-controls">
        <span class="card-dropdown">Daily ▾</span>
        <span class="card-expand">⤢</span>
      </div>
    </div>

    <div class="bars-row">
      <div class="bar-item">
        <span class="bar-number" data-target="8">0</span>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label">On Route</span>
      </div>
      <div class="bar-item">
        <span class="bar-number" data-target="2">0</span>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label">Available</span>
      </div>
      <div class="bar-item">
        <span class="bar-number" data-target="2">0</span>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label">Maintenance</span>
      </div>
      <div class="bar-item">
        <span class="bar-number" data-target="1">0</span>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label">Idle</span>
      </div>
    </div>

    <div class="card-footer">65% Active Today</div>
  </div>

  <script>
    function countUp(el, target, duration, delay) {
      setTimeout(() => {
        const start = performance.now();
        function step(now) {
          const p = Math.min((now - start) / duration, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(ease * target).toString().padStart(2, '0');
          if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }, delay);
    }

    function init() {
      const fills   = document.querySelectorAll('.bar-fill');
      const numbers = document.querySelectorAll('.bar-number');
      const footer  = document.querySelector('.card-footer');

      // Trigger bar animations
      requestAnimationFrame(() => {
        fills.forEach(f => f.classList.add('animate'));
        footer.classList.add('animate');
      });

      // Count up each number with matching stagger
      const delays = [50, 180, 310, 440];
      numbers.forEach((el, i) => {
        countUp(el, parseInt(el.dataset.target), 900, delays[i]);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      setTimeout(init, 120);
    }
  </script>
</body>
</html>

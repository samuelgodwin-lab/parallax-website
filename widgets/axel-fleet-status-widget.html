<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axel — Fleet Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: #f0f2f5;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 22px 22px 20px;
      width: 340px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }

    /* ── Header ── */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px;
    }
    .card-title { font-size: 15px; font-weight: 700; color: #111; letter-spacing: -0.02em; }
    .card-controls { display: flex; align-items: center; gap: 8px; }
    .card-dropdown {
      font-size: 11px; font-weight: 500; color: #777;
      background: #f2f3f5; border-radius: 20px; padding: 4px 11px;
    }
    .card-expand {
      width: 28px; height: 28px; border-radius: 8px;
      background: #f2f3f5; display: flex; align-items: center;
      justify-content: center; font-size: 13px; color: #aaa;
    }

    /* ── Bars ── */
    .bars-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .bar-col {
      flex: 1;
      display: flex; flex-direction: column; align-items: center;
      gap: 8px;
    }

    /* Fixed-height arch track — always visible as grey */
    .bar-track {
      width: 100%;
      height: 130px;                          /* fixed so arch never collapses */
      border-radius: 999px 999px 12px 12px;
      background: #eef0f3;
      position: relative;
      overflow: hidden;
    }

    /* Fill grows from bottom */
    .bar-fill {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 0%;
      background: linear-gradient(to top, #89c8f0 0%, #b6e3fa 55%, #d6f2ff 100%);
    }

    /* Number inside arch, bottom-aligned */
    .bar-number {
      position: absolute;
      bottom: 10px; left: 0; right: 0;
      text-align: center;
      font-size: 18px; font-weight: 800; color: #1a3a4a;
      letter-spacing: -0.03em; line-height: 1;
      z-index: 2;
    }

    .bar-label {
      font-size: 10.5px; font-weight: 500; color: #aaa;
      text-align: center; white-space: nowrap;
    }

    /* ── Individual bar animations ── */
    /* Heights are visually proportional on a sqrt scale for clarity */
    .bar-col:nth-child(1) .bar-fill { animation: bar1 4.4s ease-in-out infinite; }
    .bar-col:nth-child(2) .bar-fill { animation: bar2 4.4s ease-in-out infinite 0.14s; }
    .bar-col:nth-child(3) .bar-fill { animation: bar3 4.4s ease-in-out infinite 0.28s; }
    .bar-col:nth-child(4) .bar-fill { animation: bar4 4.4s ease-in-out infinite 0.42s; }

    /* On Route 250 → 84% */
    @keyframes bar1 {
      0%, 4%    { height: 0%; }
      38%, 68%  { height: 84%; }
      95%, 100% { height: 0%; }
    }
    /* Available 50 → 44% */
    @keyframes bar2 {
      0%, 4%    { height: 0%; }
      38%, 68%  { height: 44%; }
      95%, 100% { height: 0%; }
    }
    /* Maintenance 25 → 28% */
    @keyframes bar3 {
      0%, 4%    { height: 0%; }
      38%, 68%  { height: 28%; }
      95%, 100% { height: 0%; }
    }
    /* Idle 14 → 18% */
    @keyframes bar4 {
      0%, 4%    { height: 0%; }
      38%, 68%  { height: 18%; }
      95%, 100% { height: 0%; }
    }

    /* ── Footer ── */
    .card-footer {
      text-align: center;
      font-size: 13px; font-weight: 600; color: #3dbf7a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <span class="card-title">Fleet Status</span>
      <div class="card-controls">
        <span class="card-dropdown">Daily ▾</span>
        <span class="card-expand">↗</span>
      </div>
    </div>

    <div class="bars-row">
      <div class="bar-col">
        <div class="bar-track">
          <div class="bar-fill"></div>
          <span class="bar-number" data-target="250" data-from="0">0</span>
        </div>
        <span class="bar-label">On Route</span>
      </div>
      <div class="bar-col">
        <div class="bar-track">
          <div class="bar-fill"></div>
          <span class="bar-number" data-target="50" data-from="0">0</span>
        </div>
        <span class="bar-label">Available</span>
      </div>
      <div class="bar-col">
        <div class="bar-track">
          <div class="bar-fill"></div>
          <span class="bar-number" data-target="25" data-from="0">0</span>
        </div>
        <span class="bar-label">Maintenance</span>
      </div>
      <div class="bar-col">
        <div class="bar-track">
          <div class="bar-fill"></div>
          <span class="bar-number" data-target="14" data-from="0">0</span>
        </div>
        <span class="bar-label">Idle</span>
      </div>
    </div>

    <div class="card-footer">65% Active Today</div>
  </div>

  <script>
    const CYCLE    = 4400;
    const RISE_END = CYCLE * 0.38;   // peak reached at ~1670ms
    const HOLD_END = CYCLE * 0.68;   // hold until ~2990ms
    const FALL_END = CYCLE * 0.95;   // back to 0 at ~4180ms

    function ease(p) { return 1 - Math.pow(1 - p, 3); }

    function animateNumber(el, from, to, startMs, durationMs) {
      const begin = performance.now() + startMs;
      function step(now) {
        if (now < begin) { requestAnimationFrame(step); return; }
        const p   = Math.min((now - begin) / durationMs, 1);
        el.textContent = String(Math.round(from + ease(p) * (to - from)));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function runCycle(el, stagger) {
      const target = parseInt(el.dataset.target);

      // Count up during rise (with stagger offset)
      animateNumber(el, 0, target, stagger, RISE_END * 0.85);

      // Count back down during fall
      animateNumber(el, target, 0, HOLD_END + stagger, (FALL_END - HOLD_END) * 0.85);
    }

    const staggerDelays = [0, 140, 280, 420];

    function startLoops() {
      document.querySelectorAll('.bar-number').forEach((el, i) => {
        runCycle(el, staggerDelays[i]);
        setInterval(() => runCycle(el, staggerDelays[i]), CYCLE);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startLoops);
    } else {
      startLoops();
    }
  </script>
</body>
</html>

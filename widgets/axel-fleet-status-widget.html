<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axel — Fleet Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: #f0f2f5;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 22px 22px 18px;
      width: 340px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }

    /* ── Header ── */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px;
    }
    .card-title { font-size: 15px; font-weight: 700; color: #111; letter-spacing: -0.02em; }
    .card-controls { display: flex; align-items: center; gap: 8px; }
    .card-dropdown {
      font-size: 11px; font-weight: 500; color: #777;
      background: #f2f3f5; border-radius: 20px;
      padding: 4px 10px; display: flex; align-items: center; gap: 4px;
    }
    .card-expand {
      width: 28px; height: 28px; border-radius: 8px;
      background: #f2f3f5; display: flex; align-items: center;
      justify-content: center; font-size: 12px; color: #999; cursor: pointer;
    }

    /* ── Bar chart ── */
    .bars-row {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 10px; height: 148px; padding: 0 2px;
    }
    .bar-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 8px;
    }
    .bar-number {
      font-size: 24px; font-weight: 800; color: #111;
      letter-spacing: -0.04em; line-height: 1; min-width: 32px; text-align: center;
    }

    /* The arch-shaped track */
    .bar-track {
      width: 100%; flex: 1;
      border-radius: 999px 999px 10px 10px;
      background: #eef0f3;
      overflow: hidden;
      display: flex; align-items: flex-end;
    }

    /* The gradient fill — pure CSS animation loop */
    .bar-fill {
      width: 100%;
      border-radius: inherit;
      transform: scaleY(0);
      transform-origin: bottom center;
      animation: barLoop 4.2s cubic-bezier(0.34, 1.1, 0.64, 1) infinite;
    }

    /* Bar colours and individual heights */
    .bar-item:nth-child(1) .bar-fill {
      height: 84%;
      background: linear-gradient(to top, #a8d8f0, #c2ecfa);
      animation-delay: 0s;
    }
    .bar-item:nth-child(2) .bar-fill {
      height: 48%;
      background: linear-gradient(to top, #a8d8f0, #c2ecfa);
      animation-delay: 0.14s;
    }
    .bar-item:nth-child(3) .bar-fill {
      height: 48%;
      background: linear-gradient(to top, #a8d8f0, #c2ecfa);
      animation-delay: 0.28s;
    }
    .bar-item:nth-child(4) .bar-fill {
      height: 24%;
      background: linear-gradient(to top, #a8d8f0, #c2ecfa);
      animation-delay: 0.42s;
    }

    @keyframes barLoop {
      0%        { transform: scaleY(0); }
      28%, 68%  { transform: scaleY(1); }
      92%, 100% { transform: scaleY(0); }
    }

    .bar-label {
      font-size: 10.5px; font-weight: 500; color: #aaa;
      text-align: center; letter-spacing: 0.01em;
    }

    /* ── Footer ── */
    .card-footer {
      margin-top: 18px; text-align: center;
      font-size: 13px; font-weight: 600; color: #3dbf7a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <span class="card-title">Fleet Status</span>
      <div class="card-controls">
        <span class="card-dropdown">Daily ▾</span>
        <span class="card-expand">↗</span>
      </div>
    </div>

    <div class="bars-row">
      <div class="bar-item">
        <span class="bar-number" data-target="8" data-from="5">05</span>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label">On Route</span>
      </div>
      <div class="bar-item">
        <span class="bar-number" data-target="2" data-from="0">00</span>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label">Available</span>
      </div>
      <div class="bar-item">
        <span class="bar-number" data-target="2" data-from="0">00</span>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label">Maintenance</span>
      </div>
      <div class="bar-item">
        <span class="bar-number" data-target="1" data-from="0">00</span>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label">Idle</span>
      </div>
    </div>

    <div class="card-footer">65% Active Today</div>
  </div>

  <script>
    const CYCLE    = 4200;  // must match animation-duration
    const COUNT_MS = 900;   // how long the count-up lasts
    const HOLD_MS  = 1600;  // how long we hold at target before resetting

    function countUp(el, from, to, duration) {
      const start = performance.now();
      function step(now) {
        const p    = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        const val  = Math.round(from + ease * (to - from));
        el.textContent = String(val).padStart(2, '0');
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function runNumberCycle(el) {
      const from = parseInt(el.dataset.from);
      const to   = parseInt(el.dataset.target);

      // Count up from 'from' to target
      countUp(el, from, to, COUNT_MS);

      // After hold period, snap back to 'from' and repeat next cycle
      setTimeout(() => {
        el.textContent = String(from).padStart(2, '0');
      }, COUNT_MS + HOLD_MS);
    }

    const staggerDelays = [0, 140, 280, 420];

    function startLoops() {
      document.querySelectorAll('.bar-number').forEach((el, i) => {
        // Initial run with stagger
        setTimeout(() => runNumberCycle(el), staggerDelays[i]);

        // Loop every CYCLE ms, offset by stagger
        setTimeout(() => {
          setInterval(() => runNumberCycle(el), CYCLE);
        }, staggerDelays[i]);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startLoops);
    } else {
      startLoops();
    }
  </script>
</body>
</html>

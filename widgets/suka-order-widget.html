<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suka Order Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      padding: 24px 20px;
    }

    .card {
      background: #2d4a35;
      border-radius: 20px;
      padding: 20px 16px 18px;
      width: 100%;
      max-width: 400px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 4px rgba(0,0,0,0.25);
    }

    /* Card background texture from design */
    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 20px;
      pointer-events: none;
    }

    /* All card content sits above background */
    .card-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Steps ── */
    .steps-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
    }

    /* Connector lines — one segment per step, sits behind circles */
    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 20px;
      left: calc(50% + 22px);
      width: calc(100% - 44px);
      height: 0;
      border-top: 2px dashed rgba(229,229,229,0.22);
      transition: border-color 0.6s ease;
      z-index: 0;
    }
    .step.done:not(:last-child)::after  { border-color: rgba(162,131,69,0.65); }
    .step.active:not(:last-child)::after { border-color: rgba(229,229,229,0.22); }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      flex: 1;
      position: relative;
      z-index: 2;
    }
    .step-circle {
      width: 40px; height: 40px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(245,240,232,0.2);
      transition: background 0.5s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
      overflow: hidden;
    }
    .step.active .step-circle {
      background: #f5f0e8;
      transform: scale(1.1);
    }
    .step.done .step-circle {
      background: rgba(162,131,69,0.28);
    }
    .step-circle svg {
      width: 20px; height: 20px;
      transition: color 0.4s ease;
      overflow: visible;
    }
    .step.active  .step-circle svg { color: #285037; }
    .step.done    .step-circle svg { color: rgba(237,199,121,0.8); }
    .step.pending .step-circle svg { color: rgba(245,240,232,0.4); }

    .step-label {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.64px;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      transition: color 0.4s ease;
    }
    .step.active  .step-label { color: #fff; font-weight: 700; }
    .step.done    .step-label { color: rgba(160,190,170,0.8); }
    .step.pending .step-label { color: #8caa96; }

    /* Pulse ring on active step */
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.55; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    .step.active .step-circle::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(245,240,232,0.6);
      animation: pulse 1.8s ease-out infinite;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: rgba(229,229,229,0.25);
      margin: 0;
    }

    /* ── Estimated row ── */
    .estimated-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 38px;
    }
    .est-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .est-label {
      font-size: 9px;
      font-weight: 600;
      color: #a0beaa;
      letter-spacing: 1.08px;
      text-transform: uppercase;
    }
    .est-time {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 400;
      color: #fff;
      line-height: 1;
    }
    .live-tracking {
      font-size: 12px;
      color: #bfa36a;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    /* ── Progress bar ── */
    .bar-bg {
      height: 5px;
      background: #455442;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #a28345, #edc779);
      width: 0%;
      transition: width 1.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Chef note ── */
    .note {
      font-size: 11px;
      color: #dcd7cd;
      line-height: normal;
      white-space: nowrap;
    }

    /* ── Delivered overlay ── */
    @keyframes pop-in {
      0%   { transform: scale(0.8); opacity: 0; }
      70%  { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .delivered-badge {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(162,131,69,0.18);
      border: 1px solid rgba(237,199,121,0.35);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: #edc779;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .delivered-badge.show {
      display: flex;
      animation: pop-in 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
  </style>
</head>

        <div class="est-label">Estimated Delivery</div>
        <div class="est-time" id="countdown">15 mins</div>
      </div>
      <div class="live-tracking">Live tracking ›</div>
    </div>

    <!-- Progress bar -->
    <div class="bar-bg">
      <div class="bar-fill" id="bar-fill"></div>
    </div>

    <!-- Note -->
    <div class="note" id="note">Our chef is preparing your delicious meal</div>
    <div class="delivered-badge" id="delivered-badge">🎉 Your order has been delivered!</div>

  </div>
</div>

<script>
  const STAGES = [
    { barPct: 28, startSecs: 900, endSecs: 660, note: 'Our chef is preparing your delicious meal' },
    { barPct: 54, startSecs: 600, endSecs: 420, note: 'Your order is packed and ready for pickup' },
    { barPct: 80, startSecs: 360, endSecs: 120, note: 'Rohan is 2.1 km away from your location' },
    { barPct: 100, startSecs: 0,   endSecs: 0,   note: '' },
  ];

  const STAGE_DURATION = 5000;
  const TICK_MS        = 80;

  let stage = 0;
  let countdownSecs = 0;
  let tickTimer = null;
  let stageTimer = null;

  const elCountdown = document.getElementById('countdown');
  const elFill      = document.getElementById('bar-fill');
  const elNote      = document.getElementById('note');
  const elBadge     = document.getElementById('delivered-badge');

  function fmt(s) {
    const m = Math.floor(s / 60), sec = Math.round(s % 60);
    if (m > 0) return `${m}:${String(sec).padStart(2,'0')} mins`;
    return `${sec} secs`;
  }

  function setStage(idx) {
    stage = idx;
    const s = STAGES[idx];

    elFill.style.width = s.barPct + '%';

    elNote.style.display  = s.note ? 'block' : 'none';
    elNote.textContent    = s.note;
    if (idx === 3) elBadge.classList.add('show');
    else           elBadge.classList.remove('show');

    for (let i = 0; i < 4; i++) {
      const el = document.getElementById('step-' + i);
      el.className = 'step ' + (i < idx ? 'done' : i === idx ? 'active' : 'pending');
    }

    clearInterval(tickTimer);
    if (idx < 3) {
      const totalSteps = STAGE_DURATION / TICK_MS;
      const decrement  = (s.startSecs - s.endSecs) / totalSteps;
      countdownSecs    = s.startSecs;
      elCountdown.textContent = fmt(countdownSecs);
      tickTimer = setInterval(() => {
        countdownSecs = Math.max(s.endSecs, countdownSecs - decrement);
        elCountdown.textContent = fmt(countdownSecs);
      }, TICK_MS);
    } else {
      elCountdown.textContent = '00:00';
    }
  }

  function advance() {
    clearInterval(tickTimer);
    const next = (stage + 1) % STAGES.length;
    setStage(next);
    stageTimer = setTimeout(advance, next === 3 ? STAGE_DURATION * 1.6 : STAGE_DURATION);
  }

  setStage(0);
  stageTimer = setTimeout(advance, STAGE_DURATION);
</script>

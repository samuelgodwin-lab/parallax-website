<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suka Weather Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      padding: 24px 20px 48px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 18px 20px;
    }

    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* ── Left ── */
    .weather-left {
      position: relative;
      z-index: 1;
      flex: 1 0 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow: hidden;
    }

    .location {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.35px;
      text-transform: uppercase;
      color: #b4c8b9;
      white-space: nowrap;
    }

    .temp-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .temp {
      font-family: 'Cormorant Garamond', serif;
      font-size: 56px;
      font-weight: 400;
      color: #fff;
      line-height: normal;
      white-space: nowrap;
    }
    .temp.flip {
      animation: temp-flip 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes temp-flip {
      0%   { transform: translateY(-14px); opacity: 0; }
      100% { transform: translateY(0);     opacity: 1; }
    }

    .weather-icon {
      width: 44px;
      height: 39px;
      flex-shrink: 0;
      overflow: visible;
    }

    .weather-desc {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .desc-main { font-size: 11px; color: #bed2c3; font-weight: 400; white-space: nowrap; }
    .desc-sub  { font-size: 11px; color: #a0b4a5; font-weight: 400; white-space: nowrap; }

    /* ── Right / Sunset ── */
    .sunset-side {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .sunset-icon { width: 33px; height: 33px; }

    .sunset-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .sunset-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: #a0b4a5;
    }
    .sunset-time {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
  </style>
</head>

<script>
  const TEMPS = ['24°', '26°', '28°', '31°', '29°', '28°'];
  const STAGE_DURATION = 3000;
  let idx = 0;
  const elTemp = document.getElementById('temp');

  function advance() {
    idx = (idx + 1) % TEMPS.length;
    elTemp.textContent = TEMPS[idx];
    elTemp.classList.remove('flip');
    void elTemp.offsetWidth;
    elTemp.classList.add('flip');
    setTimeout(advance, STAGE_DURATION);
  }

  setTimeout(advance, STAGE_DURATION);
</script>

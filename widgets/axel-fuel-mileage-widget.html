<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axel — Fuel & Mileage Trends</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f0f2f5; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px 20px 16px;
      width: 400px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    /* ── Header ── */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-title { font-size: 14px; font-weight: 600; color: #111; letter-spacing: -0.01em; }
    .card-controls { display: flex; align-items: center; gap: 8px; }
    .card-dropdown {
      font-size: 11px; font-weight: 500; color: #888;
      background: #f4f4f6; border-radius: 6px;
      padding: 3px 8px;
    }
    .card-expand { font-size: 13px; color: #bbb; line-height: 1; }

    /* ── Stats row ── */
    .stats-row {
      display: flex; gap: 24px; margin-bottom: 10px;
    }
    .stat-item { display: flex; flex-direction: column; gap: 1px; }
    .stat-label { font-size: 10px; font-weight: 500; color: #aaa; letter-spacing: 0.02em; }
    .stat-value {
      font-size: 22px; font-weight: 800; letter-spacing: -0.04em; color: #111;
      line-height: 1.1;
    }
    .stat-value .unit {
      font-size: 13px; font-weight: 500; color: #999; margin-left: 2px; letter-spacing: 0;
    }

    /* ── Fuel usage badge ── */
    .fuel-badge {
      font-size: 10.5px; font-weight: 500; color: #3dbf7a; margin-bottom: 12px;
      opacity: 0; transform: translateY(3px);
      transition: opacity 0.4s ease 0.6s, transform 0.4s ease 0.6s;
    }
    .fuel-badge.animate { opacity: 1; transform: translateY(0); }
    .fuel-badge strong { font-weight: 700; }

    /* ── Chart ── */
    .chart-wrap { position: relative; width: 100%; }

    .chart-svg { width: 100%; display: block; overflow: visible; }

    /* Gradient stroke via linearGradient in SVG */
    .line-path {
      fill: none;
      stroke: url(#lineGrad);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .area-path {
      stroke: none;
      fill: url(#areaGrad);
    }

    /* X-axis labels */
    .axis-labels {
      display: flex; justify-content: space-between;
      padding: 4px 2px 0;
    }
    .axis-labels span {
      font-size: 10px; color: #bbb; font-weight: 500;
      width: 24px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <span class="card-title">Fuel &amp; Mileage Trends</span>
      <div class="card-controls">
        <span class="card-dropdown">Weekly ▾</span>
        <span class="card-expand">⤢</span>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Total Kilometers Driven</span>
        <span class="stat-value" data-target="1230" data-decimals="0">0<span class="unit">km</span></span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Average Fuel Efficiency</span>
        <span class="stat-value" data-target="12.8" data-decimals="1">0<span class="unit">km/l</span></span>
      </div>
    </div>

    <div class="fuel-badge">Fuel Usage <strong>+8%</strong> vs last week</div>

    <div class="chart-wrap">
      <svg class="chart-svg" viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#5bb8e8"/>
            <stop offset="50%"  stop-color="#4ecfd6"/>
            <stop offset="100%" stop-color="#6be6c4"/>
          </linearGradient>
          <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#6be6c4" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#6be6c4" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <!--
          Data points (Mon–Sun), y=0 is top, y=110 is bottom.
          Values scaled so higher usage = higher y (lower on screen).
          Points: (10,68),(70,48),(130,72),(190,52),(250,30),(310,58),(355,78)
        -->

        <!-- Area fill (drawn under line, fades in) -->
        <path class="area-path" id="areaPath"
          d="M10,68 C30,68 50,48 70,48 C90,48 110,72 130,72 C150,72 170,52 190,52 C210,52 230,30 250,30 C270,30 290,58 310,58 C330,58 345,78 355,78 L355,110 L10,110 Z"
          opacity="0" />

        <!-- Line -->
        <path class="line-path" id="linePath"
          d="M10,68 C30,68 50,48 70,48 C90,48 110,72 130,72 C150,72 170,52 190,52 C210,52 230,30 250,30 C270,30 290,58 310,58 C330,58 345,78 355,78" />

        <!-- Data point dots -->
        <circle id="d0" cx="10"  cy="68" r="3.5" fill="#5bb8e8" opacity="0"/>
        <circle id="d1" cx="70"  cy="48" r="3.5" fill="#50c8dc" opacity="0"/>
        <circle id="d2" cx="130" cy="72" r="3.5" fill="#4dd3d2" opacity="0"/>
        <circle id="d3" cx="190" cy="52" r="3.5" fill="#4adcc8" opacity="0"/>
        <circle id="d4" cx="250" cy="30" r="3.5" fill="#56e2be" opacity="0"/>
        <circle id="d5" cx="310" cy="58" r="3.5" fill="#65e4bc" opacity="0"/>
        <circle id="d6" cx="355" cy="78" r="3.5" fill="#6be6c4" opacity="0"/>
      </svg>

      <div class="axis-labels">
        <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
      </div>
    </div>
  </div>

  <script>
    function countUp(el, target, decimals, duration, delay) {
      const unit = el.querySelector('.unit');
      const unitHTML = unit ? unit.outerHTML : '';
      setTimeout(() => {
        const start = performance.now();
        function step(now) {
          const p = Math.min((now - start) / duration, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          const val = ease * target;
          el.innerHTML = (decimals > 0 ? val.toFixed(decimals) : Math.round(val)) + unitHTML;
          if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }, delay);
    }

    function init() {
      const linePath = document.getElementById('linePath');
      const areaPath = document.getElementById('areaPath');
      const dots     = document.querySelectorAll('[id^="d"]');
      const badge    = document.querySelector('.fuel-badge');
      const stats    = document.querySelectorAll('.stat-value');

      // ── Line draw-on ──────────────────────────────────────
      const totalLen = linePath.getTotalLength();
      linePath.style.strokeDasharray  = totalLen;
      linePath.style.strokeDashoffset = totalLen;
      linePath.style.transition = `stroke-dashoffset 1.6s cubic-bezier(0.4, 0, 0.2, 1) 0.15s`;

      requestAnimationFrame(() => {
        linePath.style.strokeDashoffset = '0';
      });

      // ── Area fill fades in after line ─────────────────────
      setTimeout(() => {
        areaPath.style.transition = 'opacity 0.6s ease';
        areaPath.style.opacity = '1';
      }, 1400);

      // ── Dots pop in sequentially ──────────────────────────
      const dotXFractions = [0, 1/6, 2/6, 3/6, 4/6, 5/6, 1];
      dotXFractions.forEach((frac, i) => {
        const delay = 150 + frac * 1600;
        setTimeout(() => {
          dots[i].style.transition = 'opacity 0.25s ease, r 0.25s ease';
          dots[i].style.opacity = '1';
        }, delay);
      });

      // ── Badge ─────────────────────────────────────────────
      badge.classList.add('animate');

      // ── Count-up stats ────────────────────────────────────
      stats.forEach(el => {
        const target   = parseFloat(el.dataset.target);
        const decimals = parseInt(el.dataset.decimals);
        countUp(el, target, decimals, 1400, 200);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      setTimeout(init, 120);
    }
  </script>
</body>
</html>

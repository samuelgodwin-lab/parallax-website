<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
  body { width: 393px; height: 852px; }
  .ph-head h1 { font-size: 36px; }
  .why { margin: 10px 20px 0; font-size: 15px; line-height: 1.45; color: var(--text-2); }
  .docs { margin: 16px 20px 0; display: flex; flex-direction: column; gap: 10px; }
  .doc { border: var(--rule) solid var(--border); padding: 12px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
  .doc .th { width: 52px; height: 64px; background: var(--surface-raised); border: var(--rule) solid var(--border); position: relative; }
  .doc .th::before, .doc .th::after { content: ''; position: absolute; left: 8px; right: 8px; height: 3px; background: var(--border-strong); top: 14px; box-shadow: 0 8px 0 var(--border-strong), 0 16px 0 var(--border-strong), 0 24px 0 var(--border); }
  .doc .th::after { top: auto; bottom: 8px; right: 24px; box-shadow: none; background: var(--accent-muted); height: 8px; }
  .doc b { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; display: block; }
  .doc span.m { font-family: var(--font-m); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); display: block; margin-top: 4px; }
  .doc .ok { font-family: var(--font-m); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--success); }
  .doc.wait { border-color: var(--accent); box-shadow: 3px 3px 0 0 var(--accent); }
  .doc .q { font-family: var(--font-m); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); text-align: right; }
  .prog { grid-column: 1 / -1; height: 4px; background: var(--surface-raised); }
  .prog i { display: block; height: 100%; width: 35%; background: var(--accent); }
  .cam { margin: 14px 20px 0; height: 56px; border: var(--rule) dashed var(--border-strong); display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-m); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); }
</style></head>
<body><div class="phone" data-tabs="Apply,Status,Fees,Help" data-tab="0">
  <div class="ph-head">
    <div class="top"><span class="eyebrow">Step 4 of 6 · Documents</span><span class="ibtn">?</span></div>
    <h1 class="serif">Photograph it. <em>Don't scan it.</em></h1>
  </div>
  <p class="why">We shrink each photo on your phone, so it sends on a weak signal.</p>
  <div class="docs">
    <div class="doc"><span class="th"></span><div><b>Class 12 marksheet</b><span class="m">3.8 MB → 240 KB</span></div><span class="ok">✓ Sent</span></div>
    <div class="doc"><span class="th"></span><div><b>ID proof</b><span class="m">2.9 MB → 190 KB</span></div><span class="ok">✓ Sent</span></div>
    <div class="doc wait"><span class="th"></span><div><b>ST certificate</b><span class="m">4.1 MB → 260 KB</span></div><span class="q">Waiting<br>for signal</span><div class="prog"><i></i></div></div>
  </div>
  <div class="cam"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add another document</div>
</div><script src="phone.js"></script></body></html>

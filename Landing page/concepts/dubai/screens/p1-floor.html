<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
  body { width: 393px; height: 852px; }
  .plan { margin: 16px 20px 0; padding: 14px; border-radius: 20px; background: var(--sand); }
  .plan svg { display: block; width: 100%; }
  .plan .key { display: flex; gap: 14px; font-size: 11px; color: var(--ink-2); margin-top: 10px; }
  .plan .key span { display: inline-flex; align-items: center; gap: 6px; }
  .list { padding: 16px 20px 0; display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 12px; }
  .row .th { width: 64px; height: 64px; border-radius: 12px; background: url('img/interior.jpg') center/cover; }
  .row h3 { font-size: 16px; font-weight: 600; }
  .row p { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
  .row .pr { text-align: right; font-size: 14px; font-weight: 600; }
  .row .pr small { display: block; font-size: 11px; color: var(--palm); font-weight: 600; margin-top: 4px; }
  .row.sel { box-shadow: 0 0 0 2px var(--copper); }
  .seg { margin: 16px 20px 0; display: flex; gap: 6px; }
</style></head>
<body><div class="phone" data-tab="0">
  <div class="ph-head">
    <div class="top"><span class="ibtn">‹</span><span class="eyebrow">Tower B</span><span class="ibtn">♡</span></div>
    <h1 class="serif">Floor 24. <em>Three left.</em></h1>
  </div>
  <div class="seg"><span class="chip chip--on">2 bed</span><span class="chip">Sea view</span><span class="chip">60/40</span></div>
  <div class="plan">
    <svg viewBox="0 0 320 200">
      <rect x="2" y="2" width="316" height="196" rx="10" fill="#FBF9F5" stroke="#D8CDBB" stroke-width="1.5"/>
      <rect x="128" y="74" width="64" height="52" rx="4" fill="#E0D7C8"/>
      <text x="160" y="104" text-anchor="middle" font-family="Manrope" font-size="9" fill="#8F877B" letter-spacing="1">CORE</text>
      <g font-family="Manrope" font-size="10" font-weight="600" text-anchor="middle">
        <rect x="8" y="8" width="72" height="62" rx="6" fill="#DCD4C6"/><text x="44" y="43" fill="#8F877B">01</text>
        <rect x="84" y="8" width="72" height="62" rx="6" fill="#DCD4C6"/><text x="120" y="43" fill="#8F877B">02</text>
        <rect x="160" y="8" width="72" height="62" rx="6" fill="#F3E3D6" stroke="#C9774A" stroke-width="1.2"/><text x="196" y="43" fill="#A4552A">03</text>
        <rect x="236" y="8" width="76" height="92" rx="6" fill="#A4552A"/><text x="274" y="58" fill="#fff">04</text>
        <rect x="236" y="104" width="76" height="88" rx="6" fill="#DCD4C6"/><text x="274" y="152" fill="#8F877B">05</text>
        <rect x="160" y="130" width="72" height="62" rx="6" fill="#DCD4C6"/><text x="196" y="165" fill="#8F877B">06</text>
        <rect x="84" y="130" width="72" height="62" rx="6" fill="#F3E3D6" stroke="#C9774A" stroke-width="1.2"/><text x="120" y="165" fill="#A4552A">07</text>
        <rect x="8" y="74" width="72" height="118" rx="6" fill="#DCD4C6"/><text x="44" y="137" fill="#8F877B">08</text>
      </g>
    </svg>
    <div class="key"><span><i class="dot" style="background:var(--copper)"></i>Selected</span><span><i class="dot" style="background:var(--copper-t);box-shadow:inset 0 0 0 1px var(--copper-2)"></i>Available</span><span><i class="dot" style="background:#DCD4C6"></i>Sold</span></div>
  </div>
  <div class="list">
    <div class="card row sel"><span class="th"></span><div><h3>Residence 2404</h3><p>2 bed · 1,284 sq ft · corner, sea</p></div><div class="pr num">2.48M<small>Available</small></div></div>
    <div class="card row"><span class="th" style="background-position:30% 50%"></span><div><h3>Residence 2403</h3><p>2 bed · 1,170 sq ft · sea</p></div><div class="pr num">2.21M<small>Available</small></div></div>
    <div class="card row"><span class="th" style="background-position:70% 50%"></span><div><h3>Residence 2407</h3><p>2 bed · 1,152 sq ft · garden</p></div><div class="pr num">1.98M<small>Available</small></div></div>
  </div>
</div><script src="phone.js"></script></body></html>

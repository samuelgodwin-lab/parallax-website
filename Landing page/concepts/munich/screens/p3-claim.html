<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
  body { width: 393px; height: 852px; }
  .ph-head h1 { font-size: 34px; }
  .photos { margin: 16px 20px 0; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 88px 88px; gap: 4px; }
  .photos i { background: url('img/claim.jpg') center/cover; }
  .photos i:first-child { grid-row: span 2; background-position: 40% 60%; }
  .photos i:nth-child(2) { background-position: 80% 30%; background-size: 260%; }
  .photos i:nth-child(3) { background-position: 20% 90%; background-size: 240%; }
  .tl { margin: 18px 20px 0; border-top: var(--rule) solid var(--border); }
  .st { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: var(--rule) solid var(--border); }
  .st i { width: 22px; height: 22px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; }
  .st.d i { background: var(--text); border-color: var(--text); }
  .st.n i { border-color: var(--accent); box-shadow: 2px 2px 0 0 var(--accent); }
  .st h5 { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .st span { font-family: var(--font-m); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
  .pay { margin: 16px 20px 0; padding: 16px; background: var(--text); color: var(--bg); display: flex; justify-content: space-between; align-items: flex-end; }
  .pay p { font-family: var(--font-m); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .pay b { font-size: 30px; font-weight: 700; letter-spacing: -0.04em; display: block; margin-top: 6px; }
  .pay span { font-family: var(--font-m); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-hi); text-align: right; }
  .handler { margin: 14px 20px 0; display: flex; gap: 12px; align-items: center; padding: 12px; border: var(--rule) solid var(--border); }
  .handler .av { width: 40px; height: 40px; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--font-m); font-size: 12px; }
  .handler b { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
  .handler p { font-family: var(--font-m); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin-top: 3px; }
</style></head>
<body><div class="phone" data-tabs="Home,Policy,Claims,Help" data-tab="2">
  <div class="ph-head">
    <div class="top"><span class="eyebrow">Claim 0091 · Today 14:02</span><span class="ibtn">+</span></div>
    <h1 class="serif">Water damage, <em>reported.</em></h1>
  </div>
  <div class="photos"><i></i><i></i><i></i></div>
  <div class="tl">
    <div class="st d"><i><svg width="12" height="12" viewBox="0 0 16 16"><path d="M3.5 8.4l3 3 6-6" fill="none" stroke="#fff" stroke-width="2"/></svg></i><h5>Reported from your phone</h5><span>4 min</span></div>
    <div class="st n"><i></i><h5>Reviewed by a person</h5><span>Within 48 h</span></div>
    <div class="st"><i></i><h5>Paid to your account</h5><span>—</span></div>
  </div>
  <div class="pay"><div><p>Estimated payout</p><b class="num">€1,240</b></div><span>Excess €0<br>Add a receipt →</span></div>
  <div class="handler"><span class="av">JM</span><div><b>Jonas, your case handler</b><p>Replies here, not by post</p></div></div>
</div><script src="phone.js"></script></body></html>
